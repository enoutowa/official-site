  <main>

    <section class="blog-page">

      <h2>BLOG</h2>

        id="article-content"

  <a href="#" class="back-to-top">
    ↑ TOP
  </a>


  <script src="./blog-data.js"></script>

  <script>

    const params = new URLSearchParams(window.location.search);

    const articleId = params.get("id");

    const article = blogPosts.find((post) => {
      return post.id === articleId;
    });

    const articleContent = document.getElementById("article-content");


    if (article) {

      document.title =
        article.title + " | 鴛鴦トワ Official Website";


      articleContent.innerHTML = `

        <div class="blog-entry-head">

          <p class="blog-date">
            ${article.date}
          </p>

          <p class="blog-tag">
            ${article.category}
          </p>

        </div>


        <h3>
          🐾${article.title}🐾
        </h3>


        ${article.content}


        <p>
          <a href="./blog.html">
            ← BLOG一覧へ戻る
          </a>
        </p>

      `;

    } else {

      articleContent.innerHTML = `

        <h3>
          記事が見つかりませんでした
        </h3>

        <p>
          <a href="./blog.html">
            ← BLOG一覧へ戻る
          </a>
        </p>

      `;

    }

  </script>
