<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>LYRICS | 鴛鴦トワ Official Website</title>

  <meta
    name="description"
    content="鴛鴦トワのオリジナル楽曲の歌詞を掲載しています。"
    id="page-description"
  >

  <meta
    name="robots"
    content="index, follow"
    id="page-robots"
  >

  <link
    rel="canonical"
    href="https://enoutowa.github.io/official-site/lyrics-article.html"
    id="page-canonical"
  >

  <meta
    property="og:type"
    content="article"
  >

  <meta
    property="og:title"
    content="LYRICS | 鴛鴦トワ Official Website"
    id="og-title"
  >

  <meta
    property="og:description"
    content="鴛鴦トワのオリジナル楽曲の歌詞を掲載しています。"
    id="og-description"
  >

  <meta
    property="og:url"
    content="https://enoutowa.github.io/official-site/lyrics-article.html"
    id="og-url"
  >

  <meta
    property="og:site_name"
    content="鴛鴦トワ Official Website"
  >

  <link
    rel="stylesheet"
    href="./style.css"
  >
</head>


<body>

  <header>

    <div class="header-inner">

      <p class="header-sub">
        OFFICIAL WEBSITE
      </p>

      <h1>
        鴛鴦トワ
      </h1>

    </div>


    <nav>
      <a href="./index.html#news">NEWS</a>
      <a href="./index.html#profile">PROFILE</a>
      <a href="./index.html#music">MUSIC</a>
      <a href="./index.html#jukebox">JUKEBOX</a>
      <a href="./index.html#video">VIDEO</a>
      <a href="./lyrics.html">LYRICS</a>
      <a href="./blog.html">BLOG</a>
      <a href="./index.html#novel">NOVEL</a>
      <a href="./gallery.html">GALLERY</a>
      <a href="./index.html#link">LINK</a>
    </nav>

  </header>


  <main>

    <article
      class="lyrics-article"
      id="lyrics-article"
    >
    </article>

  </main>


  <footer class="site-footer">

    <div class="footer-inner">

      <p class="footer-title">
        鴛鴦トワ Official Website
      </p>

      <div class="footer-submenu">

  <a href="./terms.html">
    利用規約
  </a>

  <span>|</span>

  <a href="./privacy.html">
    プライバシーポリシー
  </a>

  <span>|</span>

  <a href="./contact.html">
    お問い合わせ
  </a>

</div>

      <p class="footer-copy">
        © 鴛鴦トワ
      </p>

    </div>

  </footer>


  <a href="#" class="back-to-top">
    ↑ TOP
  </a>


  <script src="./lyrics-data.js"></script>

  <script>
    const params =
      new URLSearchParams(window.location.search);

    const songId =
      params.get("id");

    const song =
      typeof lyricsItems !== "undefined" &&
      Array.isArray(lyricsItems)
        ? lyricsItems.find((item) => {
            return item.id === songId;
          })
        : null;


    const lyricsArticle =
      document.getElementById("lyrics-article");

    const pageDescription =
      document.getElementById("page-description");

    const pageRobots =
      document.getElementById("page-robots");

    const pageCanonical =
      document.getElementById("page-canonical");

    const ogTitle =
      document.getElementById("og-title");

    const ogDescription =
      document.getElementById("og-description");

    const ogUrl =
      document.getElementById("og-url");


    if (!song) {

      document.title =
        "楽曲が見つかりません | LYRICS | 鴛鴦トワ Official Website";

      pageDescription.setAttribute(
        "content",
        "指定された楽曲の歌詞ページが見つかりませんでした。"
      );

      pageRobots.setAttribute(
        "content",
        "noindex, follow"
      );


      lyricsArticle.innerHTML = `

        <div class="lyrics-body">

          <p>
            楽曲が見つかりませんでした。
          </p>

        </div>


        <div class="lyrics-back">

          <a href="./lyrics.html">
            ← 歌詞一覧へ戻る
          </a>

        </div>

      `;

    } else {

      const pageTitle =
        `${song.title} 歌詞 | 鴛鴦トワ Official Website`;

      const description =
        `鴛鴦トワ「${song.title}」の歌詞。作詞・作曲：鴛鴦トワ。オリジナル楽曲の歌詞を公式サイトで掲載しています。`;

      const canonicalUrl =
        `https://enoutowa.github.io/official-site/lyrics-article.html?id=${encodeURIComponent(song.id)}`;


      /* =========================
         SEO情報
      ========================= */

      document.title =
        pageTitle;

      pageDescription.setAttribute(
        "content",
        description
      );

      pageCanonical.setAttribute(
        "href",
        canonicalUrl
      );

      ogTitle.setAttribute(
        "content",
        pageTitle
      );

      ogDescription.setAttribute(
        "content",
        description
      );

      ogUrl.setAttribute(
        "content",
        canonicalUrl
      );


      /* =========================
         YouTube
      ========================= */

      let youtubeHtml = "";

      if (song.youtube) {

        youtubeHtml = `

          <div class="lyrics-youtube-card">

            <h3>
              『${song.title}』をYouTubeで聴く
            </h3>

            <iframe
              src="https://www.youtube.com/embed/${song.youtube}"
              title="${song.title}"
              loading="lazy"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              allowfullscreen>
            </iframe>

          </div>

        `;

      }


      /* =========================
         歌詞ページ
      ========================= */

      lyricsArticle.innerHTML = `

        <div class="lyrics-song-info">

          <h2>
            ${song.title}
          </h2>

          <div class="lyrics-song-meta">

            <img
              src="${song.cover}"
              alt="${song.title} ジャケット"
              class="lyrics-cover"
            >

            <div class="lyrics-meta-text">

              <p class="lyrics-artist">
                ${song.artist}
              </p>

              <p>
                ${song.releaseDate} リリース
              </p>

              <p>
                <strong>作詞</strong>　${song.lyricist}
              </p>

              <p>
                <strong>作曲</strong>　${song.composer}
              </p>

            </div>

          </div>

        </div>


        <div class="lyrics-body">

          ${song.lyrics}

        </div>


        ${youtubeHtml}


        <div class="lyrics-back">

          <a href="./lyrics.html">
            ← 歌詞一覧へ戻る
          </a>

        </div>

      `;

    }
  </script>

</body>

</html>
