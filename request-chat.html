<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>制作依頼チャット | 鴛鴦トワ Official Website</title>

  <meta
    name="description"
    content="鴛鴦トワ 制作依頼専用チャット"
  >

  <link
    rel="stylesheet"
    href="./style.css"
  >

  <style>
    .request-chat-page {
      max-width: 860px;
      margin: 0 auto;
      padding: 48px 18px 90px;
    }

    .request-chat-head {
      text-align: center;
      margin-bottom: 28px;
    }

    .request-chat-label {
      margin: 0 0 8px;
      color: #8c6ca8;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .16em;
    }

    .request-chat-head h2 {
      margin: 0 0 12px;
      color: #4d3c59;
      font-size: clamp(24px, 5vw, 34px);
    }

    .request-chat-head p {
      margin: 0;
      color: #776c7d;
      line-height: 1.8;
    }

    .request-chat-card {
      overflow: hidden;
      border: 1px solid #eadff0;
      border-radius: 22px;
      background: #fff;
      box-shadow: 0 10px 30px rgba(87, 62, 104, .08);
    }

    .request-chat-info {
      padding: 18px 20px;
      border-bottom: 1px solid #eee4f2;
      background: #faf7fc;
    }

    .request-chat-number {
      margin: 0 0 5px;
      color: #8c6ca8;
      font-size: 12px;
      font-weight: 700;
    }

    .request-chat-title {
      margin: 0;
      color: #45364f;
      font-size: 18px;
      font-weight: 800;
    }

    .request-chat-messages {
      min-height: 330px;
      max-height: 560px;
      overflow-y: auto;
      padding: 22px 16px;
      background:
        linear-gradient(rgba(252, 249, 253, .96), rgba(252, 249, 253, .96)),
        radial-gradient(circle at 20% 20%, #eadff3 0 2px, transparent 3px);
    }

    .request-chat-empty,
    .request-chat-loading {
      padding: 75px 10px;
      text-align: center;
      color: #998da0;
      font-size: 13px;
    }

    .request-chat-message {
      display: flex;
      margin: 0 0 14px;
    }

    .request-chat-message.client {
      justify-content: flex-end;
    }

    .request-chat-message.admin {
      justify-content: flex-start;
    }

    .request-chat-bubble {
      max-width: min(76%, 560px);
      padding: 11px 14px;
      border-radius: 17px;
      word-break: break-word;
      white-space: pre-wrap;
      line-height: 1.75;
      font-size: 14px;
    }

    .request-chat-message.client .request-chat-bubble {
      border-bottom-right-radius: 5px;
      background: #8b69a5;
      color: #fff;
    }

    .request-chat-message.admin .request-chat-bubble {
      border: 1px solid #eadff0;
      border-bottom-left-radius: 5px;
      background: #fff;
      color: #4e4453;
    }

    .request-chat-time {
      display: block;
      margin-top: 5px;
      opacity: .68;
      font-size: 10px;
    }

    .request-chat-form {
      padding: 16px;
      border-top: 1px solid #eee4f2;
      background: #fff;
    }

    .request-chat-form textarea {
      width: 100%;
      min-height: 110px;
      resize: vertical;
      box-sizing: border-box;
      padding: 13px 14px;
      border: 1px solid #dfd2e5;
      border-radius: 14px;
      outline: none;
      font: inherit;
      line-height: 1.7;
      background: #fff;
    }

    .request-chat-form textarea:focus {
      border-color: #a88abd;
      box-shadow: 0 0 0 3px rgba(168, 138, 189, .12);
    }

    .request-chat-send {
      width: 100%;
      margin-top: 10px;
      padding: 13px 16px;
      border: 0;
      border-radius: 999px;
      background: #82629b;
      color: #fff;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    .request-chat-send:disabled {
      opacity: .55;
      cursor: default;
    }

    .request-chat-status {
      min-height: 20px;
      margin: 8px 0 0;
      text-align: center;
      color: #776c7d;
      font-size: 12px;
    }

    .request-chat-error {
      padding: 55px 20px;
      text-align: center;
      color: #765467;
      line-height: 1.8;
    }

    @media screen and (max-width: 600px) {
      .request-chat-page {
        padding: 30px 12px 80px;
      }

      .request-chat-messages {
        min-height: 300px;
        max-height: 52vh;
        padding: 18px 12px;
      }

      .request-chat-bubble {
        max-width: 84%;
      }
    }
  </style>
</head>

<body>

  <header>

    <div class="header-inner">

      <p class="header-sub">
        OFFICIAL WEBSITE
      </p>

      <h1>
        鴛鴦トワ
      </h1>

    </div>

    <nav>
      <a href="./index.html#news">NEWS</a>
      <a href="./index.html#profile">PROFILE</a>
      <a href="./index.html#music">MUSIC</a>
      <a href="./index.html#jukebox">JUKEBOX</a>
      <a href="./index.html#video">VIDEO</a>
      <a href="./lyrics.html">LYRICS</a>
      <a href="./blog.html">BLOG</a>
      <a href="./index.html#novel">NOVEL</a>
      <a href="./gallery.html">GALLERY</a>
      <a href="./index.html#link">LINK</a>
    </nav>

  </header>

  <main>

    <section class="request-chat-page">

      <div class="request-chat-head">

        <p class="request-chat-label">
          PRIVATE REQUEST CHAT
        </p>

        <h2>
          制作依頼 専用チャット
        </h2>

        <p>
          このページは、招待された方だけが利用できる<br>
          制作依頼専用のチャットです。
        </p>

      </div>

      <div class="request-chat-card" id="chatCard">

        <div class="request-chat-loading">
          チャットを読み込んでいます…
        </div>

      </div>

    </section>

  </main>

  <footer class="site-footer">

    <div class="footer-inner">

      <p class="footer-title">
        鴛鴦トワ Official Website
      </p>

      <div class="footer-submenu">

        <a href="./index.html">
          HOME
        </a>

        <span>|</span>

        <a href="./terms.html">
          利用規約
        </a>

        <span>|</span>

        <a href="./contact.html">
          お問い合わせ
        </a>

      </div>

      <p class="footer-copy">
        © 鴛鴦トワ
      </p>

    </div>

  </footer>

  <script>
    const API_BASE =
      "https://enou-towa-admin.miyu-run-0220.workers.dev";

    const params = new URLSearchParams(location.search);
    const token = params.get("token") || "";

    const chatCard = document.getElementById("chatCard");

    function esc(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function formatTime(value) {
      if (!value) return "";

      const date = new Date(
        String(value).replace(" ", "T") + "Z"
      );

      if (Number.isNaN(date.getTime())) {
        return String(value);
      }

      return new Intl.DateTimeFormat("ja-JP", {
        timeZone: "Asia/Tokyo",
        month: "numeric",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      }).format(date);
    }

    function scrollBottom() {
      const area =
        document.getElementById("chatMessages");

      if (area) {
        area.scrollTop = area.scrollHeight;
      }
    }

    async function api(path, options = {}) {
      const response = await fetch(
        API_BASE + path,
        options
      );

      const data = await response.json()
        .catch(() => null);

      if (!response.ok || !data?.ok) {
        throw new Error(
          data?.message || "通信に失敗しました"
        );
      }

      return data;
    }

    function renderChat(data) {
      const item = data.request || {};
      const messages = data.messages || [];

      const messageHtml = messages.length
        ? messages.map(message => {
            const sender =
              message.sender === "admin"
                ? "admin"
                : "client";

            const label =
              sender === "admin"
                ? "鴛鴦トワ"
                : "あなた";

            return `
              <div class="request-chat-message ${sender}">
                <div class="request-chat-bubble">
                  ${esc(message.body)}
                  <span class="request-chat-time">
                    ${esc(label)} ・ ${esc(formatTime(message.created_at))}
                  </span>
                </div>
              </div>
            `;
          }).join("")
        : `
          <div class="request-chat-empty">
            まだメッセージはありません。<br>
            ご相談内容や確認したいことを送ってください。
          </div>
        `;

      chatCard.innerHTML = `
        <div class="request-chat-info">
          <p class="request-chat-number">
            ${esc(item.publicId || "")}
          </p>

          <p class="request-chat-title">
            ${esc(item.title || "制作依頼")}
          </p>
        </div>

        <div
          class="request-chat-messages"
          id="chatMessages"
        >
          ${messageHtml}
        </div>

        <form
          class="request-chat-form"
          id="chatForm"
        >
          <textarea
            id="chatBody"
            maxlength="3000"
            placeholder="メッセージを入力してください"
            required
          ></textarea>

          <button
            type="submit"
            class="request-chat-send"
            id="chatSend"
          >
            送信する
          </button>

          <p
            class="request-chat-status"
            id="chatStatus"
          ></p>
        </form>
      `;

      document
        .getElementById("chatForm")
        .addEventListener(
          "submit",
          sendMessage
        );

      scrollBottom();
    }

    async function loadChat() {
      if (!token) {
        chatCard.innerHTML = `
          <div class="request-chat-error">
            招待URLを確認してください。
          </div>
        `;
        return;
      }

      try {
        const data = await api(
          "/api/public/request-chat?token=" +
          encodeURIComponent(token)
        );

        renderChat(data);
      } catch (error) {
        chatCard.innerHTML = `
          <div class="request-chat-error">
            ${esc(error.message)}
          </div>
        `;
      }
    }

    async function sendMessage(event) {
      event.preventDefault();

      const textarea =
        document.getElementById("chatBody");

      const button =
        document.getElementById("chatSend");

      const status =
        document.getElementById("chatStatus");

      const body = textarea.value.trim();

      if (!body) return;

      button.disabled = true;
      status.textContent = "送信中…";

      try {
        await api(
          "/api/public/request-chat",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              token,
              body
            })
          }
        );

        textarea.value = "";
        status.textContent = "送信しました";

        await loadChat();

      } catch (error) {
        status.textContent = error.message;

      } finally {
        button.disabled = false;
      }
    }

    loadChat();
  </script>

</body>
</html>
