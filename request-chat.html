<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>制作依頼 専用チャット | 鴛鴦トワ Official Website</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="./style.css">

  <style>
    * { box-sizing: border-box; }

    .request-chat-page {
      width: min(920px, calc(100% - 28px));
      margin: 48px auto 100px;
    }

    .request-chat-header,
    .request-chat-box {
      background: rgba(255,255,255,.86);
      border: 1px solid rgba(118,77,142,.14);
      box-shadow: 0 12px 35px rgba(96,66,115,.08);
      border-radius: 24px;
    }

    .request-chat-header {
      padding: 30px 24px;
      text-align: center;
      margin-bottom: 22px;
    }

    .request-chat-label {
      margin: 0 0 8px;
      color: #8a699c;
      font-size: 12px;
      letter-spacing: .16em;
      font-weight: 700;
    }

    .request-chat-header h2 {
      margin: 0;
      color: #694b78;
      font-size: clamp(22px, 5vw, 32px);
    }

    .request-chat-info {
      margin-top: 15px;
      color: #806f89;
      font-size: 13px;
      line-height: 1.8;
    }

    .request-chat-box {
      padding: 18px;
    }

    .chat-notice {
      padding: 14px 16px;
      margin-bottom: 18px;
      border-radius: 14px;
      background: #f5eff8;
      color: #735f7e;
      font-size: 12px;
      line-height: 1.7;
    }

    .chat-messages {
      min-height: 250px;
      max-height: 58vh;
      overflow-y: auto;
      padding: 4px 2px 18px;
    }

    .chat-empty {
      padding: 50px 10px;
      text-align: center;
      color: #9a8ca2;
      font-size: 13px;
    }

    .chat-row {
      display: flex;
      margin: 13px 0;
    }

    .chat-row.client { justify-content: flex-end; }
    .chat-row.towa { justify-content: flex-start; }

    .chat-bubble {
      max-width: min(78%, 620px);
      padding: 12px 14px;
      border-radius: 18px;
      line-height: 1.7;
      font-size: 14px;
      word-break: break-word;
    }

    .chat-row.client .chat-bubble {
      color: white;
      background: linear-gradient(135deg, #8a61a2, #73508d);
      border-bottom-right-radius: 6px;
    }

    .chat-row.towa .chat-bubble {
      color: #604d6a;
      background: #f3edf6;
      border-bottom-left-radius: 6px;
    }

    .chat-time {
      margin-top: 6px;
      opacity: .7;
      font-size: 10px;
    }

    .chat-images {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
      margin-top: 9px;
    }

    .chat-images img {
      width: 100%;
      aspect-ratio: 1/1;
      object-fit: cover;
      border-radius: 11px;
      display: block;
    }

    .chat-form {
      border-top: 1px solid rgba(118,77,142,.12);
      padding-top: 18px;
    }

    .chat-form textarea {
      width: 100%;
      min-height: 110px;
      resize: vertical;
      padding: 14px;
      border: 1px solid #d9cce0;
      border-radius: 14px;
      background: white;
      color: #54455d;
      font: inherit;
      line-height: 1.65;
    }

    .chat-file-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .chat-file-row input[type="file"] {
      max-width: 100%;
      font-size: 12px;
    }

    .chat-file-note {
      color: #92839a;
      font-size: 11px;
    }

    .chat-submit {
      width: 100%;
      margin-top: 14px;
      padding: 14px 18px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, #8a61a2, #73508d);
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .chat-submit:disabled {
      opacity: .55;
      cursor: wait;
    }

    .chat-status {
      min-height: 22px;
      margin-top: 10px;
      text-align: center;
      font-size: 12px;
    }

    .chat-status.error { color: #a23e62; }
    .chat-status.success { color: #567d66; }

    .chat-loading {
      padding: 70px 20px;
      text-align: center;
      color: #8d7d95;
    }

    .chat-invalid {
      text-align: center;
      padding: 60px 22px;
      color: #785f84;
      line-height: 1.8;
    }

    .hp-field {
      position: absolute !important;
      left: -9999px !important;
      width: 1px !important;
      height: 1px !important;
      overflow: hidden !important;
    }

    @media (max-width: 600px) {
      .request-chat-page {
        width: min(100% - 18px, 920px);
        margin-top: 24px;
      }

      .request-chat-header {
        padding: 24px 16px;
      }

      .request-chat-box {
        padding: 13px;
        border-radius: 20px;
      }

      .chat-bubble {
        max-width: 88%;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <p class="header-sub">OFFICIAL WEBSITE</p>
    <h1>鴛鴦トワ</h1>
  </div>

  <nav>
    <a href="./index.html">HOME</a>
    <a href="./request.html">REQUEST</a>
  </nav>
</header>

<main>
  <section class="request-chat-page">

    <div class="request-chat-header">
      <p class="request-chat-label">PRIVATE REQUEST CHAT</p>
      <h2>制作依頼 専用チャット</h2>
      <div id="chatInfo" class="request-chat-info">読み込み中です…</div>
    </div>

    <div class="request-chat-box">
      <div id="chatArea">
        <div class="chat-loading">チャットを読み込んでいます…</div>
      </div>
    </div>

  </section>
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <p class="footer-title">鴛鴦トワ Official Website</p>
    <p class="footer-copy">© 鴛鴦トワ</p>
  </div>
</footer>

<script>
(() => {
  const API = "https://enou-towa-admin.miyu-run-0220.workers.dev";
  const params = new URLSearchParams(location.search);
  const token = params.get("token") || "";
  const chatArea = document.getElementById("chatArea");
  const chatInfo = document.getElementById("chatInfo");

  const esc = value => String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");

  function fileToDataUrl(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function messageHtml(msg) {
    const senderClass = msg.sender === "towa" ? "towa" : "client";
    const images = (msg.files || []).length
      ? '<div class="chat-images">' + msg.files.map(file => {
          const src = API + "/api/public/request-chat/file?token=" +
            encodeURIComponent(token) + "&id=" + encodeURIComponent(file.id);
          return '<a href="' + src + '" target="_blank" rel="noopener noreferrer">' +
            '<img src="' + src + '" alt="' + esc(file.name || "添付画像") + '">' +
          '</a>';
        }).join("") + "</div>"
      : "";

    return '<div class="chat-row ' + senderClass + '">' +
      '<div class="chat-bubble">' +
        (msg.body ? '<div>' + esc(msg.body).replace(/\n/g, "<br>") + '</div>' : '') +
        images +
        '<div class="chat-time">' + esc(msg.createdAt || "") + '</div>' +
      '</div>' +
    '</div>';
  }

  async function loadChat(scrollBottom = true) {
    if (!token) {
      chatInfo.textContent = "";
      chatArea.innerHTML =
        '<div class="chat-invalid">このチャットURLは利用できません。<br>案内メールに記載されたURLからアクセスしてください。</div>';
      return;
    }

    try {
      const response = await fetch(
        API + "/api/public/request-chat?token=" + encodeURIComponent(token),
        { method: "GET" }
      );
      const data = await response.json();

      if (!response.ok || !data.ok) {
        throw new Error(data.message || "チャットを読み込めませんでした");
      }

      chatInfo.innerHTML =
        "依頼番号：" + esc(data.request.publicId) + "<br>" +
        esc(data.request.requestType) + " ｜ " + esc(data.request.title);

      const messages = data.messages || [];

      chatArea.innerHTML =
        '<div class="chat-notice">ここはご依頼者様専用のチャットです。URLは第三者へ共有しないようお願いいたします。</div>' +
        '<div id="chatMessages" class="chat-messages">' +
          (messages.length
            ? messages.map(messageHtml).join("")
            : '<div class="chat-empty">まだメッセージはありません。<br>こちらからご連絡いただけます。</div>') +
        '</div>' +
        '<form id="chatForm" class="chat-form">' +
          '<label class="hp-field">Website<input type="text" name="website" tabindex="-1" autocomplete="off"></label>' +
          '<textarea name="body" maxlength="3000" placeholder="メッセージを入力してください"></textarea>' +
          '<div class="chat-file-row">' +
            '<input type="file" name="images" accept="image/png,image/jpeg,image/webp" multiple>' +
            '<span class="chat-file-note">画像は3枚まで・1枚5MBまで</span>' +
          '</div>' +
          '<button type="submit" class="chat-submit">送信する</button>' +
          '<div id="chatStatus" class="chat-status"></div>' +
        '</form>';

      document.getElementById("chatForm").addEventListener("submit", sendMessage);

      if (scrollBottom) {
        const box = document.getElementById("chatMessages");
        if (box) box.scrollTop = box.scrollHeight;
      }
    } catch (error) {
      chatInfo.textContent = "";
      chatArea.innerHTML =
        '<div class="chat-invalid">' + esc(error.message) + '</div>';
    }
  }

  async function sendMessage(event) {
    event.preventDefault();

    const form = event.currentTarget;
    const status = document.getElementById("chatStatus");
    const button = form.querySelector('button[type="submit"]');
    const files = Array.from(form.images.files || []);

    status.className = "chat-status";
    status.textContent = "";

    if (files.length > 3) {
      status.className = "chat-status error";
      status.textContent = "画像は3枚までです。";
      return;
    }

    for (const file of files) {
      if (!["image/png", "image/jpeg", "image/webp"].includes(file.type)) {
        status.className = "chat-status error";
        status.textContent = "PNG・JPEG・WebPのみ添付できます。";
        return;
      }
      if (file.size > 5 * 1024 * 1024) {
        status.className = "chat-status error";
        status.textContent = "画像は1枚5MB以下にしてください。";
        return;
      }
    }

    button.disabled = true;
    button.textContent = "送信中…";

    try {
      const images = [];
      for (const file of files) {
        images.push({
          name: file.name,
          dataUrl: await fileToDataUrl(file)
        });
      }

      const response = await fetch(API + "/api/public/request-chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          token,
          body: form.body.value,
          website: form.website.value,
          images
        })
      });

      const data = await response.json();

      if (!response.ok || !data.ok) {
        throw new Error(data.message || "送信できませんでした");
      }

      form.reset();
      await loadChat(true);
    } catch (error) {
      status.className = "chat-status error";
      status.textContent = error.message;
    } finally {
      button.disabled = false;
      button.textContent = "送信する";
    }
  }

  loadChat(true);
})();
</script>

</body>
</html>
