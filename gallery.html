  <main>

    <section class="gallery-page">

      <h2>GALLERY</h2>

      <p class="gallery-text">
        楽曲ジャケットやキャラクターアートなど、<br>
        鴛鴦トワの活動で制作・使用しているビジュアルを掲載しています。
      </p>


      <!-- =========================

      ========================= -->

  <a href="#" class="back-to-top">
    ↑ TOP
  </a>


  <script src="./gallery-data.js"></script>

  <script>

    const ITEMS_PER_PAGE = 6;

    const galleryList =
      document.getElementById("gallery-list");

    const pagination =
      document.getElementById("pagination");


    const params =
      new URLSearchParams(window.location.search);

    let currentPage =
      Number(params.get("page")) || 1;


    const totalPages =
      Math.max(
        1,
        Math.ceil(
          galleryItems.length / ITEMS_PER_PAGE
        )
      );


    if (currentPage < 1) {
      currentPage = 1;
    }

    if (currentPage > totalPages) {
      currentPage = totalPages;
    }


    /* =========================
       GALLERY表示
    ========================= */

    function renderGallery() {

      galleryList.innerHTML = "";


      const start =
        (currentPage - 1) * ITEMS_PER_PAGE;

      const end =
        start + ITEMS_PER_PAGE;

      const pageItems =
        galleryItems.slice(start, end);


      pageItems.forEach(
        (fileName, index) => {

          const imagePath =
            `./images/${fileName}`;


          const link =
            document.createElement("a");

          link.href =
            imagePath;

          link.target =
            "_blank";

          link.rel =
            "noopener noreferrer";


          const image =
            document.createElement("img");

          image.src =
            imagePath;

          image.alt =
            `鴛鴦トワ Gallery ${
              galleryItems.length -
              (start + index)
            }`;

          image.loading =
            "lazy";


          link.appendChild(image);

          galleryList.appendChild(link);

        }
      );

    }


    /* =========================
       ページ送り
    ========================= */

    function createPageLink(
      text,
      page,
      className = ""
    ) {

      const link =
        document.createElement("a");

      link.textContent =
        text;

      link.href =
        `./gallery.html?page=${page}`;

      if (className) {
        link.className =
          className;
      }

      return link;

    }


    function renderPagination() {

      pagination.innerHTML = "";


      if (totalPages <= 1) {
        return;
      }


      if (currentPage > 1) {

        pagination.appendChild(
          createPageLink(
            "← 前へ",
            currentPage - 1,
            "pagination-prev"
          )
        );

      }


      for (
        let page = 1;
        page <= totalPages;
        page++
      ) {

        if (page === currentPage) {

          const current =
            document.createElement("span");

          current.textContent =
            page;

          current.className =
            "pagination-current";

          pagination.appendChild(current);

        } else {

          pagination.appendChild(
            createPageLink(
              page,
              page
            )
          );

        }

      }


      if (currentPage < totalPages) {

        pagination.appendChild(
          createPageLink(
            "次へ →",
            currentPage + 1,
            "pagination-next"
          )
        );

      }

    }


    renderGallery();
    renderPagination();

  </script>


</body>
