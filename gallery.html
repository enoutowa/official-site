  <script src="./gallery-data.js"></script>

  <script>

    const galleryList =
      document.getElementById("gallery-list");

    galleryItems.forEach((fileName, index) => {

      const imagePath =
        `./images/${fileName}`;

      const link =
        document.createElement("a");

      link.href = imagePath;
      link.target = "_blank";
      link.rel = "noopener noreferrer";


      const image =
        document.createElement("img");

      image.src = imagePath;
      image.alt =
        `鴛鴦トワ Gallery ${galleryItems.length - index}`;

      image.loading = "lazy";


      link.appendChild(image);
      galleryList.appendChild(link);

    });

  </script>
