    href="./style.css"
  >
</head>


<body>

  <header>

    <div class="header-inner">

      </p>

      <h1>
        鴛鴦トワ
      </h1>

    </div>


    <nav>
      <a href="./index.html#news">NEWS</a>
      <a href="./index.html#profile">PROFILE</a>
      <a href="./index.html#music">MUSIC</a>

      <a href="./gallery.html">GALLERY</a>
      <a href="./index.html#link">LINK</a>
    </nav>

  </header>


  <main>

    <section class="blog-page">

      <h2>BLOG</h2>

      <p class="blog-intro">
        制作のこと、日々のこと。<br>
        鴛鴦トワの小さな記録。
      </p>


      <!-- =========================
           BLOG一覧
      ========================= -->

      <div
        class="blog-archive"
        id="blog-archive"
      >
      </div>


      <!-- =========================
           ページ送り
      ========================= -->

        class="pagination"
        id="pagination"
      >
      </div>

    </section>

  </main>


  <footer class="site-footer">

    <div class="footer-inner">

      <p class="footer-title">
        鴛鴦トワ Official Website

    <div class="footer-submenu">

  <a href="./terms.html">

  <span>|</span>

  </a>

  <span>|</span>

  <a href="./contact.html">
    お問い合わせ
  </a>

</div>

      <p class="footer-copy">
        © 鴛鴦トワ
      </p>

    </div>

  </footer>


  <a href="#" class="back-to-top">
    ↑ TOP
  </a>


  <script src="./blog-data.js"></script>

  <script>

    const ITEMS_PER_PAGE = 5;

    const blogArchive =
      document.getElementById("blog-archive");

    const pagination =
      document.getElementById("pagination");


    const params =
      new URLSearchParams(window.location.search);

    let currentPage =
      Number(params.get("page")) || 1;


    const totalPages =
      Math.max(
        1,
        Math.ceil(
          blogPosts.length / ITEMS_PER_PAGE
        )
      );


    if (currentPage < 1) {
      currentPage = 1;
    }

    if (currentPage > totalPages) {
      currentPage = totalPages;
    }


    /* =========================
       BLOG表示
    ========================= */

    function renderBlog() {

      blogArchive.innerHTML = "";


      const start =
        (currentPage - 1) * ITEMS_PER_PAGE;

      const end =
        start + ITEMS_PER_PAGE;

      const pagePosts =
        blogPosts.slice(start, end);


      pagePosts.forEach((post) => {

        const link =
          document.createElement("a");

        link.href =
          post.url;

        link.className =
          "blog-entry-link";


        const article =
          document.createElement("article");

        article.className =
          "blog-entry";


        const head =
          document.createElement("div");

        head.className =
          "blog-entry-head";


        const date =
          document.createElement("p");

        date.className =
          "blog-date";

        date.textContent =
          post.date;


        const tag =
          document.createElement("p");

        tag.className =
          "blog-tag";

        tag.textContent =
          post.category;


        const title =
          document.createElement("h3");

        title.textContent =
          post.title;


        const summary =
          document.createElement("p");

        summary.textContent =
          post.summary;


        head.appendChild(date);
        head.appendChild(tag);

        article.appendChild(head);
        article.appendChild(title);
        article.appendChild(summary);

        link.appendChild(article);

        blogArchive.appendChild(link);

      });

    }


    /* =========================
       ページ送り
    ========================= */

    function createPageLink(
      text,
      page,
      className = ""
    ) {

      const link =
        document.createElement("a");

      link.textContent =
        text;

      link.href =
        `./blog.html?page=${page}`;

      if (className) {
        link.className =
          className;
      }

      return link;

    }


    function renderPagination() {

      pagination.innerHTML = "";


      if (totalPages <= 1) {
        return;
      }


      if (currentPage > 1) {

        pagination.appendChild(
          createPageLink(
            "← 前へ",
            currentPage - 1,
            "pagination-prev"
          )
        );

      }


      for (
        let page = 1;
        page <= totalPages;
        page++
      ) {

        if (page === currentPage) {

          const current =
            document.createElement("span");

          current.textContent =
            page;

          current.className =
            "pagination-current";

          pagination.appendChild(
            current
          );

        } else {

          pagination.appendChild(
            createPageLink(
              page,
              page
            )
          );

        }

      }


      if (currentPage < totalPages) {

        pagination.appendChild(
          createPageLink(
            "次へ →",
            currentPage + 1,
            "pagination-next"
          )
        );

      }

    }


    renderBlog();
    renderPagination();

  </script>


</body>

</html>
