  <script src="./blog-data.js"></script>

  <script>
    const blogArchive = document.getElementById("blog-archive");

    blogPosts.forEach((post) => {

      const link = document.createElement("a");

      link.href = post.url;
      link.className = "blog-entry-link";

      link.innerHTML = `
        <article class="blog-entry">

          <div class="blog-entry-head">

            <p class="blog-date">
              ${post.date}
            </p>

            <p class="blog-tag">
              ${post.category}
            </p>

          </div>

          <h3>
            ${post.title}
          </h3>

          <p>
            ${post.summary}
          </p>

        </article>
      `;

      blogArchive.appendChild(link);

    });
  </script>
